<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escáner HT y Batería → Excel</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 16px; background: #f4f6f8; color: #1f2937; }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.3rem; margin-bottom: 12px; text-align: center; }
    .card {
      background: #fff; border-radius: 12px; padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px;
    }
    .btn {
      display: block; width: 100%; padding: 13px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; margin-top: 12px; }
    .btn-outline { background: #e5e7eb; color: #374151; margin-top: 8px; }
    input[type="file"] { display: none; }
    #preview {
      width: 100%; max-height: 220px; object-fit: contain;
      border-radius: 8px; margin-top: 12px; display: none; border: 1px solid #e5e7eb;
    }
    .status { font-size: 0.9rem; color: #4b5563; margin-top: 10px; text-align: center; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 12px; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 1.05rem; text-transform: uppercase;
    }
    .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .type-btn {
      padding: 10px; border-radius: 8px; border: 2px solid #d1d5db;
      background: #f9fafb; font-weight: 700; cursor: pointer;
    }
    .type-btn.active-ht { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
    .type-btn.active-bat { border-color: #0d9488; background: #f0fdfa; color: #0f766e; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe;
      padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; cursor: pointer;
    }
    .table-wrap { overflow-x: auto; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 8px 6px; border-bottom: 1px solid #e5e7eb; text-align: left; white-space: nowrap; }
    th { background: #f9fafb; }
    .del-btn { color: #dc2626; background: none; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 Escáner HT y Batería → Excel</h1>

    <div class="card">
      <label for="cameraInput" class="btn btn-primary">📸 Sacar foto a etiqueta (HT o Batería)</label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" />

      <img id="preview" alt="Vista previa" />
      <div id="status" class="status">Esperando foto...</div>

      <label>Clasificar serial como:</label>
      <div class="type-selector">
        <button type="button" id="btnTypeHT" class="type-btn active-ht">📻 Equipo HT</button>
        <button type="button" id="btnTypeBat" class="type-btn">🔋 Batería</button>
      </div>

      <div id="candidatesBox" style="display:none;">
        <label>Candidatos detectados (tocá para usar):</label>
        <div id="chips" class="chips"></div>
      </div>

      <label for="serialInput">Número de serie (confirmar o corregir):</label>
      <input type="text" id="serialInput" placeholder="Ej: 426CVB2164 o 5000038516A4" />

      <label for="noteInput">Observación / N° de equipo (opcional):</label>
      <input type="text" id="noteInput" placeholder="Ej: Móvil 3 / Unidad 12" style="text-transform:none;" />

      <button id="addBtn" class="btn btn-success">➕ Agregar al Excel</button>
    </div>

    <div class="card">
      <strong>Registros cargados (<span id="count">0</span>)</strong>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Serial HT</th>
              <th>Serial Batería</th>
              <th>Nota</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <button id="exportBtn" class="btn btn-primary" style="margin-top:14px;">📥 Descargar Excel (.xlsx)</button>
      <button id="clearBtn" class="btn btn-outline">🗑️ Limpiar lista</button>
    </div>
  </div>

  <script>
    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const serialInput = document.getElementById('serialInput');
    const noteInput = document.getElementById('noteInput');
    const chipsEl = document.getElementById('chips');
    const candidatesBox = document.getElementById('candidatesBox');
    const tableBody = document.getElementById('tableBody');
    const countEl = document.getElementById('count');
    const btnTypeHT = document.getElementById('btnTypeHT');
    const btnTypeBat = document.getElementById('btnTypeBat');

    let selectedType = 'HT'; // 'HT' o 'BATERIA'
    let records = JSON.parse(localStorage.getItem('ht_bat_records_v1') || '[]');
    renderTable();

    function setType(type) {
      selectedType = type;
      btnTypeHT.className = 'type-btn' + (type === 'HT' ? ' active-ht' : '');
      btnTypeBat.className = 'type-btn' + (type === 'BATERIA' ? ' active-bat' : '');
    }

    btnTypeHT.addEventListener('click', () => setType('HT'));
    btnTypeBat.addEventListener('click', () => setType('BATERIA'));

    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      statusEl.textContent = '⏳ Leyendo etiqueta...';
      chipsEl.innerHTML = '';
      candidatesBox.style.display = 'none';

      try {
        const result = await Tesseract.recognize(file, 'eng', {
          logger: (m) => {
            if (m.status === 'recognizing text') {
              statusEl.textContent = `⏳ Procesando: ${Math.round(m.progress * 100)}%`;
            }
          }
        });

        const rawText = (result.data.text || '').toUpperCase();
        parseLabel(rawText);
        statusEl.textContent = '✅ Lectura lista. Revisá el tipo y el serial antes de agregar.';
      } catch (err) {
        console.error(err);
        statusEl.textContent = '❌ No se pudo leer bien. Intentá con mejor iluminación y sin reflejos.';
      }
    });

    function parseLabel(text) {
      // 1. Detectar si parece Batería o Equipo HT según palabras clave de la etiqueta
      const isBatteryLabel = /\b(BATTERY|LITHIUM|MAH|WH|PMNN|CELL ORIGIN)\b/.test(text);
      const isHTLabel = /\b(APX|FLASHPORT|TRACK NO|MODEL:|CNC ID)\b/.test(text);

      // 2. Buscar patrones explícitos "Serial No: ..." o "SN: ..."
      let detectedSerial = '';
      let detectedType = selectedType;

      // Caso batería: SN: 5000038516A4 (suele ser 12 caracteres alfanuméricos)
      const snMatch = text.match(/\bSN\s*[:\-]?\s*([A-Z0-9]{8,16})\b/);
      // Caso HT: Serial No: 426CVB2164 (suele ser 10 caracteres alfanuméricos)
      const serialNoMatch = text.match(/SERIAL\s*NO\.?\s*[:\-]?\s*([A-Z0-9]{8,16})\b/);

      if (isBatteryLabel && snMatch) {
        detectedSerial = snMatch[1];
        detectedType = 'BATERIA';
      } else if (isHTLabel && serialNoMatch) {
        detectedSerial = serialNoMatch[1];
        detectedType = 'HT';
      } else if (snMatch && !serialNoMatch) {
        detectedSerial = snMatch[1];
        detectedType = 'BATERIA';
      } else if (serialNoMatch) {
        detectedSerial = serialNoMatch[1];
        detectedType = 'HT';
      }

      // 3. Extraer candidatos adicionales por si el OCR leyó con ruido
      const tokens = text
        .replace(/[^A-Z0-9]/g, ' ')
        .split(/\s+/)
        .filter(t =>
          t.length >= 9 &&
          t.length <= 14 &&
          /\d/.test(t) &&
          !/^(PMNN4424B|2350MAH|174WH|74V|2ICR1965|2510886|PMUF1683A)$/.test(t)
        );

      const candidates = [...new Set([detectedSerial, ...tokens].filter(Boolean))];

      if (candidates.length > 0) {
        if (!detectedSerial) {
          detectedSerial = candidates[0];
          // Si tiene 12+ caracteres o empieza con 50000, suele ser batería en este modelo
          if (detectedSerial.length >= 12 || detectedSerial.startsWith('50000')) {
            detectedType = 'BATERIA';
          } else {
            detectedType = 'HT';
          }
        }
        setType(detectedType);
        serialInput.value = detectedSerial;

        candidatesBox.style.display = 'block';
        candidates.forEach(code => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.textContent = code;
          chip.onclick = () => { serialInput.value = code; };
          chipsEl.appendChild(chip);
        });
      } else {
        serialInput.value = '';
        statusEl.textContent = '⚠️ No se detectó un serial claro. Ingresalo manual o sacá otra foto.';
      }
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      const serial = serialInput.value.trim().toUpperCase();
      if (!serial) {
        alert('Ingresá o escaneá un número de serie primero.');
        return;
      }

      const now = new Date();
      records.push({
        Item: records.length + 1,
        Serial_HT: selectedType === 'HT' ? serial : '',
        Serial_Bateria: selectedType === 'BATERIA' ? serial : '',
        Tipo_Detectado: selectedType,
        Observacion: noteInput.value.trim(),
        Fecha: now.toLocaleDateString('es-AR'),
        Hora: now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })
      });

      saveAndRender();
      serialInput.value = '';
      noteInput.value = '';
      cameraInput.value = '';
    });

    function saveAndRender() {
      records = records.map((r, idx) => ({ ...r, Item: idx + 1 }));
      localStorage.setItem('ht_bat_records_v1', JSON.stringify(records));
      renderTable();
    }

    function renderTable() {
      countEl.textContent = records.length;
      tableBody.innerHTML = records.map((r, idx) => `
        <tr>
          <td>${r.Item}</td>
          <td>${r.Serial_HT ? `<strong>${r.Serial_HT}</strong>` : '-'}</td>
          <td>${r.Serial_Bateria ? `<strong>${r.Serial_Bateria}</strong>` : '-'}</td>
          <td>${r.Observacion || '-'}</td>
          <td><button class="del-btn" onclick="deleteRow(${idx})">✕</button></td>
        </tr>
      `).join('');
    }

    window.deleteRow = (idx) => {
      records.splice(idx, 1);
      saveAndRender();
    };

    document.getElementById('exportBtn').addEventListener('click', () => {
      if (records.length === 0) {
        alert('No hay registros para exportar.');
        return;
      }
      const ws = XLSX.utils.json_to_sheet(records);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Inventario_HT_Baterias');
      const fecha = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `seriales_ht_bateria_${fecha}.xlsx`);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('¿Borrar todos los registros cargados?')) {
        records = [];
        saveAndRender();
      }
    });
  </script>
</body>
</html>
